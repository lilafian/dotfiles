### monitors
## change if you are not me
monitor = DP-1, 2560x1080@200, 0x0, 1
monitor = HDMI-A-1, 1920x1080@100, -1920x-350, 1
monitor = DP-2, 1920x1080@100, 2560x0, 1
## probably want to use this
# monitor = ,highres@highrr,auto,1

### services
exec-once = hyprpaper

### applications
$terminal = alacritty
$browser = librewolf
$launcher = fuzzel

### keybinds
$mod = SUPER
binds {
	drag_threshold = 10
}
## apps
bind = $mod, A, exec, $terminal
bind = $mod, W, exec, $browser
bind = $mod SHIFT, S, exec, hyprshot -m region --clipboard-only
bind = $mod ALT, S, exec, hyprshot -m output --clipboard-only
bind = $mod SHIFT ALT, S, exec, hyprshot -m window --clipboard-only
bind = $mod, R, exec, $launcher
## window control
bindm = $mod,           mouse:272, movewindow
bindm = $mod,           mouse:273, resizewindow
bind  = $mod,           C,         killactive
bind  = $mod SHIFT ALT, C,         forcekillactive
bind  = $mod,           F,         togglefloating
bind  = $mod,           D,         togglesplit
bind  = $mod,           S,         swapsplit
## focus control
bind = $mod, Left,  movefocus, l
bind = $mod, Right, movefocus, r
bind = $mod, Up,    movefocus, u
bind = $mod, Down,  movefocus, d
## workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10
## multimedia keys
bindel = ,XF86AudioRaiseVolume, exec, sh ~/.config/hypr/volume.sh up
bindel = ,XF86AudioLowerVolume, exec, sh ~/.config/hypr/volume.sh down
bindel = ,XF86AudioMute, exec, sh ~/.config/hypr/volume.sh mute
bindel = ,XF86AudioMicMute, exec, sh ~/.config/hypr/volume.sh micmute


### animations
animation = windows, 1, 3, default, gnomed
animation = fade, 0
animation = workspaces, 1, 5, default, slidevert

### layout
dwindle {
	preserve_split = true
}

### look and feel
general {
	border_size = 2
	gaps_in = 5
	gaps_out = 20
	col.inactive_border = rgba(282828ff)
	col.active_border = rgba(ebdbb2ff)
}

decoration {
	blur {
		enabled = true
		size = 12
		passes = 2
	}
	shadow {
		enabled = false
	}
}
